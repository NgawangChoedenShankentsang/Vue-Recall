<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <h1>{{ getMessage() }}</h1>
            <p>{{ luckyNumber }}</p>
            <p>Lucky Number is an: {{ luckyNumber%2==0 ? "even" : "odd" }}</p>
            <p>Random Number: {{ getRandomNumber() }}</p>
            <!-- <p>Array: {{ arrary }}</p> -->
            <p>{{ obj.name }} is {{ obj.age }} years old and earns {{ obj.salary }}</p>
        </div>
    </body>
    <script>
        const { createApp, ref } = Vue;
        createApp({
            setup() {
                const message = "Hello World";
                const luckyNumber = ref(7);
                // const arrary = [1, 2, 3];
                const obj = {
                    name: "John",
                    age: 30,
                    salary: 5000,
                };
                function getMessage() {
                    return message.toUpperCase();
                }
                function getRandomNumber() {
                    luckyNumber.value = Math.floor(Math.random() * 10)+1;
                    return Math.floor(Math.random() * 10)+1;
                }
                return { 
                    luckyNumber, 
                    // arrary, 
                    obj,
                    getRandomNumber,
                    getMessage
                };
            },
        }).mount("#app");
    </script>
</html>
