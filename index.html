<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <span v-html="getMessage()"></span>
            <p>{{ luckyNumber }}</p>
            <p>Lucky Number is an: {{ luckyNumber%2==0 ? "even" : "odd" }}</p>
            <p>Random Number: {{ updateLuckyNumber() }}</p>
            <!-- <p>Array: {{ arrary }}</p> -->
            <p>{{ obj.name }} is {{ obj.age }} years old and earns {{ obj.salary }}</p>
        </div>
    </body>
    <script>
        const { createApp, ref, reactive } = Vue;
        createApp({
            setup() {
                const message = "Hello World";
                const luckyNumber = ref(7);
                // const arrary = [1, 2, 3];
                const obj = reactive({
                    name: "John",
                    age: 30,
                    salary: 5000,
                });
                function getMessage() {
                return `<h1>${message}</h1>`;
                }
                function updateLuckyNumber() {
                    setTimeout(() => {
                        luckyNumber.value = 55;
                        obj.age = 40;
                    }, 2000);
                }
                return { 
                    luckyNumber, 
                    // arrary, 
                    obj,
                    updateLuckyNumber,
                    getMessage
                };
            },
        }).mount("#app");
    </script>
</html>
