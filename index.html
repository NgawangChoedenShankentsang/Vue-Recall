<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
        <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    </head>
    <body>
        <div id="app">
            <h1>{{ message }}</h1>
            <p>{{ luckyNumber }}</p>
            <p>Array: {{ arrary }}</p>
            <p>{{ obj.name }} is {{ obj.age }} years old and earns {{ obj.salary }}</p>
        </div>
    </body>
    <script>
        const { createApp } = Vue;
        createApp({
            setup() {
                const message = "Hello World";
                const luckyNumber = 7;
                const arrary = [1, 2, 3];
                const obj = {
                    name: "John",
                    age: 30,
                    salary: 5000,
                };
                return { 
                    message, 
                    luckyNumber, 
                    arrary, 
                    obj
                };
            },
        }).mount("#app");
    </script>
</html>
